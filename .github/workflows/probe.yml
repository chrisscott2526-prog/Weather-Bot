name: Sports probe (read-only)

# TEMPORARY scaffolding for the pick-first sports rebuild: lets the
# rebuild branch trigger runs by push (this session has no Actions
# dispatch permission). If scan.trigger exists it runs the real scanner
# and commits the card; otherwise it runs the read-only probe and
# commits probe_report.txt. Delete this file when the rebuild lands.

on:
  push:
    branches: ["claude/sports-pick-first-rebuild-tum11x"]
    paths:
      - "sports_probe.py"
      - "probe.trigger"
      - "scan.trigger"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan (if scan.trigger exists) or probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -f scan.trigger ]; then
            python -u sports_scanner.py 2>&1 | tee scan_report.txt
            exit "${PIPESTATUS[0]}"
          else
            python -u sports_probe.py 2>&1 | tee probe_report.txt
          fi

      - name: Commit the output
        if: ${{ always() }}
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sports run $(date -u +'%F %H:%M')"
          git push || (git pull --rebase -X ours && git push)

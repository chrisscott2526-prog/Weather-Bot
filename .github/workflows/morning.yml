name: Morning strategy (refresh, scan, trade)

# THE DAY-OF LANE -- since Aug 26 2026 the ONLY lane that spends money
# (owner's call; trader.yml, the night-before buyer, is benched to
# manual-only). One job, three ordered steps:
#   1. forecast.py --today            fresh same-day GFS+ECMWF ensemble
#                                     (digests the morning's station
#                                     observations)
#   2. scanner.py --strategy morning --window 9-11
#                                     same pick-first rules, today's
#                                     markets only, and ONLY cities
#                                     whose local clock reads 9:00 to
#                                     10:59 AM right now -- late enough
#                                     that the settlement station has
#                                     reported 3-4 morning readings and
#                                     the fresh ensemble shows how the
#                                     day is leaning
#   3. trader.py  --strategy morning --keep-resting
# One job on purpose: the repo-writes concurrency group keeps at most
# one run PENDING per group; three steps in one job cannot run out of
# order and take one concurrency slot.
# Three schedules so every timezone gets exactly one in-window shot,
# summer AND winter (verified against IANA tzdata in cities.py):
#   14:30 UTC  Eastern + Central in summer; Eastern in winter
#   16:30 UTC  Mountain + Arizona + Pacific in summer; Central +
#              Mountain in winter
#   17:30 UTC  Pacific in winter (in summer Pacific is already owned
#              from 16:30 -- the fail-closed MAX_PER_CITY_DAY exposure
#              check makes a double-covered hour harmless)
# --keep-resting: each run must not yank the earlier runs' resting
# orders; unfilled same-day orders die on their own at market close.

on:
  schedule:
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install crypto library
        run: pip install cryptography

      - name: Refresh today's forecast (same-day ensemble)
        run: python forecast.py --today

      - name: Scan today's markets (day-of, 9-11 AM local window)
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python scanner.py --strategy morning --window 9-11

      - name: Place day-of trades ($1 law, one position per city per day)
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python trader.py --strategy morning --keep-resting

      # -X theirs like trader.yml, NOT -X ours like the read-only jobs:
      # this commit carries trades.csv, and losing the record of an
      # order that was actually placed is the worst possible outcome.
      - name: Commit the logs
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "day-of run $(date -u +'%F %H:%M')"
          git pull --rebase -X theirs
          git push

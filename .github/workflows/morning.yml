name: Morning strategy (refresh, scan, trade)

# THE DAY-OF LANE -- since Aug 26 2026 the ONLY lane that spends money
# (owner's call; trader.yml, the night-before buyer, is benched to
# manual-only). Each buying pass runs, in order:
#   0. poller.py                      log the settlement stations' own
#                                     readings RIGHT NOW, so the
#                                     scanner's day-of reality floor
#                                     works from minutes-old data
#   1. forecast.py --today            fresh same-day GFS+ECMWF ensemble
#   2. scanner.py --strategy morning --window 9-11
#                                     same pick-first rules, today's
#                                     markets only, and ONLY cities
#                                     whose local clock reads 9:00 to
#                                     10:59 AM right now
#   3. trader.py  --strategy morning --keep-resting
#   4. commit + push (retry loop)     then turn the pass RED-flagged
#                                     if any order errored
#
# THE EXECUTION RELAY (Aug 30 2026, owner decision). The Clock Fix
# (Aug 28) scheduled 12 single-shot runs and hoped GitHub would fire
# enough of them. It didn't: on Aug 29 only two fired on their own --
# the first at 17:03, AFTER the East Coast window had closed -- and
# every East Coast and Central buy that day was the owner pressing
# Run by hand. Single-shot runs need every slot to fire; one dropped
# cron = a dropped coast. So this job is now a RELAY:
#   - The FIRST trigger that lands -- any of the 12 cron slots below
#     (kept as redundant starters), the daily 12:50 UTC Claude
#     routine, or the owner pressing Run -- starts ONE long job that
#     runs a full buying pass every 30 minutes (at :07 and :37, the
#     off-peak minutes) until 18:45 UTC, then exits. One lucky
#     trigger now covers the whole day instead of 1/12th of it.
#   - Extra triggers while the relay runs queue in the
#     morning-money-relay concurrency group and stand down in seconds
#     when their turn comes (past 18:45 = nothing to do). If the
#     relay's runner DIES mid-day, the queued run takes over the rest
#     of the day instead. GitHub keeps only the newest queued run and
#     cancels older queued ones -- those "cancelled" runs in the
#     Actions list are normal, not failures. Extra passes are
#     harmless: the 9-11 window gate and the fail-closed
#     MAX_PER_CITY_DAY exposure check see to that.
#   - This job LEFT the shared repo-writes concurrency group: a
#     six-hour holder of that lock would freeze the poller, swoop,
#     and settlement jobs all afternoon. Push races with those jobs
#     are handled by the retry loop plus .gitattributes merge=union
#     on the append-only CSVs, so simultaneous appends keep both
#     sides' rows (the Aug 20 lost-settlements scar).
#   - A pass that fails (dead forecast feed, crashed trader, failed
#     order) WARNS loudly, skips what it must, and lets the next
#     pass retry -- and any failed pass turns the finished run RED
#     (the dead-feed scar: a problem must never scroll away green).
#   - timeout-minutes rides under GitHub's 6-hour job ceiling, and
#     the loop exits early when the runner lease is running out so a
#     queued starter can take over cleanly.
# The promise to the owner is unchanged: each city is bought (or
# loudly skipped) within about half an hour of 9:00 AM its own time,
# and the Station Board shows which happened and why.
#
# --keep-resting: each pass must not yank the earlier passes' resting
# orders; unfilled same-day orders die on their own at market close.

on:
  schedule:
    - cron: "7,37 13-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# NOT repo-writes -- see the relay note above.
concurrency:
  group: morning-money-relay
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install crypto library
        run: pip install cryptography

      - name: Run the buying day (one pass every 30 min until 18:45 UTC)
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"

          DAY_END_EPOCH=$(date -u -d "$(date -u +%F) 18:45" +%s)
          START_EPOCH=$(date +%s)
          ANY_ERROR=0

          if [ "$START_EPOCH" -ge "$DAY_END_EPOCH" ]; then
            echo "Started $(date -u +%H:%M) UTC -- past the 18:45 UTC end of the buying day. Standing down."
            exit 0
          fi

          # Real retry loop; -X theirs (NOT -X ours like the read-only
          # jobs) because this commit carries trades.csv, and losing
          # the record of an order that was actually placed is the
          # worst possible outcome. The append-only CSVs union-merge
          # via .gitattributes, so a race with poll/swoop/scan keeps
          # both sides' rows.
          commit_push() {
            git add -A
            git diff --cached --quiet || git commit -m "day-of run $(date -u +'%F %H:%M')"
            local n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 4 ]; then
                echo "::error::push failed after $n tries -- keeping the commit locally; the next pass will retry the push"
                ANY_ERROR=1
                return 0
              fi
              git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
              sleep $((2*n))
            done
          }

          run_pass() {
            echo "::group::Pass $(date -u +'%H:%M') UTC"
            OPEN=$(python - <<'PY'
          from datetime import datetime, timezone
          from cities import TIMEZONES, STATIONS, local_time
          now = datetime.now(timezone.utc)
          print(", ".join(sorted(STATIONS[s] for s in TIMEZONES
                                 if 9 <= local_time(s, now).hour < 11)))
          PY
          )
            echo "In their 9-11 AM window: ${OPEN:-no city}"

            # Every pass, in or out of window: keeps the Station and
            # Swoop boards fed even when poll.yml's cron is dropped.
            python poller.py || echo "::warning::poller.py failed this pass -- no fresh reality floor"

            if [ -n "$OPEN" ]; then
              rm -f trader_run.log
              if python forecast.py --today; then
                if python scanner.py --strategy morning --window 9-11; then
                  python trader.py --strategy morning --keep-resting | tee trader_run.log \
                    || { echo "::warning::trader.py crashed this pass"; ANY_ERROR=1; }
                else
                  echo "::warning::scanner failed this pass -- no trade attempt"
                  ANY_ERROR=1
                fi
              else
                echo "::warning::same-day forecast refresh FAILED -- skipping the Kalshi steps this pass (never trade on a stale same-day forecast)"
                ANY_ERROR=1
              fi
            fi

            commit_push

            # An order that errors (e.g. insufficient balance) must
            # turn the day RED. On Aug 24, 26 and 29 orders died on an
            # empty wallet; the alarm below is why Aug 29's run showed
            # red. Checked AFTER the commit so the trades.csv record
            # of the failure is never lost to a failing step.
            if [ -n "$OPEN" ] && [ -f trader_run.log ] && grep -q "ERROR" trader_run.log; then
              echo "::error::An order FAILED on the $(date -u +%H:%M) pass -- likely insufficient balance. The bot had a pick and could not pay for it."
              grep "ERROR" trader_run.log || true
              ANY_ERROR=1
            fi
            echo "::endgroup::"
          }

          while :; do
            run_pass
            NEXT_EPOCH=$(python - <<'PY'
          from datetime import datetime, timezone, timedelta
          t = datetime.now(timezone.utc).replace(second=0, microsecond=0)
          while True:
              t += timedelta(minutes=1)
              if t.minute in (7, 37):
                  break
          print(int(t.timestamp()))
          PY
          )
            if [ "$NEXT_EPOCH" -ge "$DAY_END_EPOCH" ]; then
              echo "Buying day complete -- the next :07/:37 slot is past 18:45 UTC."
              break
            fi
            if [ $((NEXT_EPOCH - START_EPOCH)) -ge 19800 ]; then
              echo "::warning::approaching the 6-hour runner ceiling -- exiting so a queued starter can take over the rest of the day"
              break
            fi
            NAP=$((NEXT_EPOCH - $(date +%s)))
            [ "$NAP" -gt 0 ] && sleep "$NAP"
          done

          if [ "$ANY_ERROR" -eq 1 ]; then
            echo "::error::At least one pass failed today -- see the red annotations above."
            exit 1
          fi

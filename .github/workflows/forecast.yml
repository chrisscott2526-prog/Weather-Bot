name: Log nightly forecasts

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# OWN concurrency group (Sep 10 2026). This job sat in the shared
# repo-writes line, where GitHub allows only ONE waiting run: a newer
# repo-writes job displaces the waiting one and marks it "cancelled".
# The nightly forecast fires late (~00:30 UTC), queued behind whatever
# held the lock, and was displaced by the next scan/sports/settle run --
# 5 cancelled nights out of 7 (Sep 2-8), each one a lost calibration
# night. Racing pushes are already handled by this job's retry loop
# plus union-merge on forecasts.csv and model_research.csv, the same
# solved problem as poll.yml and morning.yml, which left the shared
# line for the same reason.
concurrency:
  group: nightly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # 5 minutes was always tight: the money fetch alone takes ~3.5.
    # On Sep 13 and Sep 14 2026 slow ICON/NWS research calls pushed the
    # job into the 5-minute ceiling and GitHub killed it MID-RESEARCH --
    # before the commit step -- so the already-successful money forecast
    # was thrown away with it, two nights running. 15 keeps the job
    # bounded (every job carries timeout-minutes) with real headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fetch forecasts
        run: python forecast.py

      # THE MONEY FORECAST COMMITS FIRST (Sep 14 2026 -- the timeout
      # scar above). continue-on-error already protected the commit
      # from a research feed that FAILS; this ordering protects it from
      # one that HANGS. Whatever happens after this step -- a stuck
      # API, a timeout, a lost runner -- tonight's calibration rows are
      # already on main.
      - name: Commit the money forecast
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "forecasts $(date -u +'%F')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

      # THE MODEL LAB (Aug 31 2026): research passengers ride the same
      # nightly run (icon/gem ensembles + hrrr/nbm/ukmo/nws single
      # numbers since the Sep 15 2026 widen-the-field pass).
      # continue-on-error so a dead research feed can never cost the
      # run its commits; its OWN timeout so a HUNG feed is cut loose as
      # a loud step failure instead of eating the whole job (the Sep
      # 13-14 2026 lesson). Leash 8 -> 10 min with the wider field --
      # six passengers make more calls; a hang still dies loudly.
      - name: Log research models (passengers)
        id: modellab
        continue-on-error: true
        timeout-minutes: 10
        run: python model_lab.py

      - name: Commit the research log
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "model lab $(date -u +'%F')"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

      - name: Fail loudly if a research feed died
        if: steps.modellab.outcome == 'failure'
        run: |
          echo "model_lab.py failed or hung past its own timeout -- a"
          echo "research model feed is dead or every city errored (see"
          echo "its step log above). The money forecast is unaffected"
          echo "and already committed; this red exists so the dead feed"
          echo "cannot scroll away green."
          exit 1

name: Log nightly forecasts

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Fetch forecasts
        run: python forecast.py

      # THE MODEL LAB (Aug 31 2026): research passengers (ICON + NWS)
      # ride the same nightly run. continue-on-error so a dead research
      # feed can never cost the money forecast its commit -- the red
      # flag AFTER the commit still fails the run loudly (dead-feed law).
      - name: Log research models (ICON + NWS)
        id: modellab
        continue-on-error: true
        run: python model_lab.py

      - name: Commit the log
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "forecasts $(date -u +'%F')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

      - name: Fail loudly if a research feed died
        if: steps.modellab.outcome == 'failure'
        run: |
          echo "model_lab.py failed -- a research model feed is dead or"
          echo "every city errored (see its step log above). The money"
          echo "forecast is unaffected and already committed; this red"
          echo "exists so the dead feed cannot scroll away green."
          exit 1

name: Swoop alert

on:
  schedule:
    - cron: "0 17,19,21,23 * * *"   # ~1pm-7pm ET: the heat-of-the-day window
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  swoop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Grade open positions against the thermometer
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python swoop_alert.py

      - name: Commit the board
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "swoop $(date -u +'%F %H:%M')"
          git pull --rebase
          git push

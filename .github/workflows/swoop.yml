name: Swoop alert

# Off-peak minutes (Aug 28 2026): GitHub drops crowded cron slots --
# see poll.yml. The heat-of-day band now also covers 00:00-01:59 UTC,
# because the West Coast's heating hours run to ~6pm Pacific = 01:00
# UTC; the old 16-23 band went quiet exactly when a Vegas or LA
# bracket was most at risk.
on:
  schedule:
    - cron: "9,24,39,54 16-23 * * *"  # heat of the day (East/Central)
    - cron: "9,24,39,54 0-1 * * *"    # West Coast late afternoon
    - cron: "9 3-15/2 * * *"          # rest of the clock: 2-hour rhythm
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  swoop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      # Fresh readings first: the board grades against temps_log.csv,
      # and poll.yml's own cron gets dropped by GitHub for hours at a
      # time (Aug 28 2026: cards graded on 75-80 minute old readings).
      # Every swoop pass now brings its own thermometer.
      - name: Poll the settlement stations first
        run: python poller.py

      - name: Grade open positions against the thermometer
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python swoop_alert.py

      - name: Commit the board
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "swoop $(date -u +'%F %H:%M')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

name: Poll weather stations

# THE POLLER RELAY (Aug 30 2026). The Clock Fix (Aug 28) moved this
# cron to off-peak minutes and hoped GitHub would fire enough of the
# 96 daily slots. It didn't: on Aug 30 the poller fired 9 times in a
# day, every board sat on 1-2 hour old readings all afternoon, and
# the owner watched Phoenix "100.4°" while the market already knew
# the day had blown past 105. Single-shot runs need every slot to
# fire; one dropped cron = a stale board. So this job is now a RELAY,
# the same pattern that fixed morning.yml:
#   - The FIRST trigger that lands -- any cron slot below (kept as
#     redundant starters) or the owner pressing Run -- starts ONE
#     long job that polls every 15 minutes (at :04/:19/:34/:49, the
#     off-peak minutes) and pushes after every pass, until it nears
#     GitHub's 6-hour job ceiling, then exits.
#   - Extra triggers while the relay runs queue in the poll-relay
#     concurrency group and take over when the running relay exits
#     or its runner dies -- so with 96 starter slots a day, the
#     relay re-chains itself around the clock. GitHub keeps only
#     the newest queued run and cancels older queued ones; those
#     "cancelled" entries in the Actions list are normal, not
#     failures.
#   - This job LEFT the shared repo-writes concurrency group (same
#     reason morning.yml did): a six-hour holder of that lock would
#     freeze swoop, settlements and scans all day. Push races are
#     handled by the retry loop plus .gitattributes merge=union on
#     the append-only CSVs (temps_log.csv included), so simultaneous
#     appends keep both sides' rows.
#   - A pass that fails WARNS loudly and the next pass retries; any
#     failed pass turns the finished run RED (the dead-feed scar: a
#     problem must never scroll away green).
# morning.yml and swoop.yml still run the poller themselves too --
# belt and suspenders; repeated polls are harmless appends.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the relay tripwire below starts morning.yml when it is missing

# NOT repo-writes -- see the relay note above.
concurrency:
  group: poll-relay
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install crypto library (for the swoop grader)
        run: pip install cryptography

      - name: Run the polling relay (one pass every 15 min)
        env:
          # for watchdog.py's money-lane check (read-only runs API);
          # an unauthenticated call would share a rate limit with
          # every other job on the runner's IP
          GITHUB_TOKEN: ${{ github.token }}
          # for swoop_alert.py (reads open positions to grade them)
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"

          START_EPOCH=$(date +%s)
          ANY_ERROR=0

          # Real retry loop -- the old one-liner fallback died under
          # bash -e whenever no rebase was in progress (see
          # settlements.yml). -X ours keeps this job's freshly
          # regenerated files when a race conflicts; the append-only
          # CSVs union-merge via .gitattributes so no rows are lost
          # either way.
          commit_push() {
            git add -A
            git diff --cached --quiet || git commit -m "temps $(date -u +'%H:%M')"
            local n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 4 ]; then
                echo "::error::push failed after $n tries -- keeping the commit locally; the next pass will retry the push"
                ANY_ERROR=1
                return 0
              fi
              git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
              sleep $((2*n))
            done
          }

          while :; do
            echo "::group::Pass $(date -u +'%H:%M') UTC"
            python poller.py || { echo "::warning::poller.py failed this pass -- boards keep their last reading until the next pass"; ANY_ERROR=1; }
            # The swoop board rides the relay too (Aug 30 2026: its
            # own cron starved it 3 hours during Pacific risk hours).
            # Same rhythm as swoop.yml's old schedule: every pass in
            # the 16:00-01:59 UTC heat-of-day band, 2-hourly otherwise.
            # swoop.yml stays as a manual backup button.
            H=$((10#$(date -u +%H))); M=$((10#$(date -u +%M)))
            if [ "$H" -ge 16 ] || [ "$H" -lt 2 ] || { [ $((H % 2)) -eq 1 ] && [ "$M" -lt 15 ]; }; then
              python swoop_alert.py || { echo "::warning::swoop_alert.py failed this pass -- board keeps its last grade until the next pass"; ANY_ERROR=1; }
            fi
            # THE WATCHDOG (Aug 30 2026): every pass also checks the
            # pulses that have actually burned us (stale poller, dead
            # money lane, missing same-day forecast, failed orders,
            # stale swoop/settlements) and writes health.json for the
            # Station Board's alarm banner. An alarm turns this run
            # red at the finish, which makes GitHub email the owner.
            python watchdog.py || { echo "::warning::watchdog raised an alarm this pass -- see the lines above and the Station Board banner"; ANY_ERROR=1; }
            # THE RELAY TRIPWIRE (Sep 2 2026). Sep 1 the money relay
            # never started until 17:16 UTC -- none of morning.yml's
            # cron slots fired and neither Claude routine wake ran on
            # time -- while THIS relay polled right through the money
            # window, and the watchdog above could only alarm. So every
            # pass during the buying day (12:45-18:15 UTC) also STARTS
            # the money relay when it is missing, not just alarms.
            # workflow_dispatch is the one event GitHub explicitly lets
            # a job's own GITHUB_TOKEN trigger; an extra start queues in
            # the morning-money-relay group and stands down, so a false
            # positive costs nothing. Failures here warn and never block
            # the poll -- the watchdog alarm stays as the siren.
            NOWM=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
            if [ "$NOWM" -ge 765 ] && [ "$NOWM" -le 1095 ]; then
              ACTIVE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow morning.yml \
                         --limit 10 --json status \
                         --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length' \
                       2>/dev/null || echo "unknown")
              if [ "$ACTIVE" = "0" ]; then
                echo "::warning::money relay not running at $(date -u +%H:%M) UTC -- starting morning.yml now"
                gh workflow run morning.yml -R "$GITHUB_REPOSITORY" --ref main \
                  || echo "::warning::could not start the money relay (dispatch failed) -- the cron slots, Claude routines and the owner's Run button remain"
              elif [ "$ACTIVE" = "unknown" ]; then
                echo "::warning::could not check whether the money relay is running -- the next pass retries in ~15 min"
              else
                echo "Money relay already running/queued ($ACTIVE) -- tripwire has nothing to do."
              fi
            fi
            commit_push
            echo "::endgroup::"

            NEXT_EPOCH=$(python - <<'PY'
          from datetime import datetime, timezone, timedelta
          t = datetime.now(timezone.utc).replace(second=0, microsecond=0)
          while True:
              t += timedelta(minutes=1)
              if t.minute in (4, 19, 34, 49):
                  break
          print(int(t.timestamp()))
          PY
          )
            if [ $((NEXT_EPOCH - START_EPOCH)) -ge 19800 ]; then
              echo "Approaching the 6-hour runner ceiling -- exiting so a queued starter takes over the relay."
              break
            fi
            NAP=$((NEXT_EPOCH - $(date +%s)))
            [ "$NAP" -gt 0 ] && sleep "$NAP"
          done

          if [ "$ANY_ERROR" -eq 1 ]; then
            echo "::error::At least one pass failed this relay -- see the red annotations above."
            exit 1
          fi

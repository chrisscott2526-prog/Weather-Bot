name: Poll weather stations

# Off-peak minutes on purpose (Aug 28 2026): GitHub's scheduler is
# best-effort and drops crowded slots -- on "*/15" (the :00/:15/:30/:45
# rush minutes) this poll fired ~11 times a day instead of 96, and the
# boards sat stale for hours. Odd minutes fire far more reliably, and
# morning.yml + swoop.yml now also run the poller themselves so board
# data rides along with every run that does fire.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run poller
        run: python poller.py

      - name: Commit the log
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "temps $(date -u +'%H:%M')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

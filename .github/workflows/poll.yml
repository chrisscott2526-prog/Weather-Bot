name: Poll weather stations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run poller
        run: python poller.py

      - name: Commit the log
        timeout-minutes: 3
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "temps $(date -u +'%H:%M')"
          git pull --rebase || (git rebase --abort; git pull --rebase -X theirs)
          git push

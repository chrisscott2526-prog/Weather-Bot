name: Model lab probe (read-only, on demand)

# THE PROBE BUTTON for candidate forecast models -- the sports_probe
# pattern applied to the Model Lab (Sep 15 2026, the widen-the-field
# pass). Runs model_lab.py on BOTH horizons (tonight's for-tomorrow
# question and the same-day question) into throwaway files that are
# never committed, and prints every per-city success or failure to
# the log. Use it to verify a NEW candidate model live from GitHub's
# own runners (this repo's sessions cannot reach Open-Meteo from
# their sandbox) BEFORE the candidate rides the nightly run -- the
# whitelist law: no feed joins unverified.
#
# Read-only by construction: no commit step, no secrets, nothing
# written back to the repo. A candidate that returns zero rows across
# all 20 cities exits non-zero and turns this run RED (dead-feed
# law), which is exactly the loud answer the probe exists to get.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Both horizons ALWAYS run (continue-on-error + the red flag at
      # the end, forecast.yml's pattern) -- probe run 1 proved that a
      # failing today-step otherwise skips the tomorrow probe entirely.
      # KNOWN QUIRK, not a dead feed: an --today probe pressed after
      # dark honestly logs nws=0 rows, because the NWS drops a day's
      # "daytime" forecast period once that daytime is over (the real
      # same-day lab runs at 14:12/19:42 UTC, when it exists). A red
      # probe at that hour means READ THE PER-CITY LOG, not
      # necessarily that a candidate is dead.
      - name: Probe TODAY horizon (throwaway output)
        id: today
        continue-on-error: true
        run: python model_lab.py --today --out /tmp/probe_today.csv

      - name: Probe TOMORROW horizon (throwaway output)
        id: tomorrow
        continue-on-error: true
        run: python model_lab.py --out /tmp/probe_tomorrow.csv

      - name: Fail loudly if either horizon had a dead feed
        if: steps.today.outcome == 'failure' || steps.tomorrow.outcome == 'failure'
        run: |
          echo "A probe horizon reported a dead feed (zero rows across"
          echo "all 20 cities for some model -- see the per-city log"
          echo "above). Mind the after-dark nws quirk in the header"
          echo "comment before declaring a candidate dead."
          exit 1

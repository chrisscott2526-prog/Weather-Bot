name: Rules panel audit (one-off, read-only)

# Manual-only audit: prints the rules text of one market per city series
# so we can see which series name The Weather Company vs the NWS as the
# settlement source. Reads unauthenticated Kalshi market data, commits
# nothing, touches no CSV. Safe to delete once the question is answered.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rules-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Read the rules panels
        run: python3 rules_audit.py

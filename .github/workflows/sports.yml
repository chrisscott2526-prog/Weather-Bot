name: Sports card scan

on:
  schedule:
    # Off-peak minute :23 (Sep 11 2026): both slots sat on minute :00,
    # the minute GitHub's best-effort scheduler drops most -- the 15:00
    # scan was skipped outright on Sep 11 and the 22:00 one fired 95
    # minutes late the night before, leaving the daily card a day
    # stale. Same fix, same reason as settlements.yml on Sep 10.
    - cron: "23 15 * * *"  # ~11am ET: lines are up for the day's slates
    - cron: "23 22 * * *"  # ~6pm ET: evening slates + late line moves
  workflow_dispatch:
    inputs:
      probe:
        description: "Run sports_probe.py instead (read-only inventory report in the log; writes nothing)"
        type: boolean
        default: false
      kalshi_only:
        description: "Probe only: skip the Odds API part so the run spends zero credits (Kalshi market data is free)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The sports card is ADVISORY ONLY (see CLAUDE.md) and reads Kalshi's
      # public market data unauthenticated -- ODDS_API_KEY is its only
      # secret. A dead odds feed exits non-zero ON PURPOSE after writing an
      # honest card, so the run shows red instead of publishing a green,
      # confident, empty card (which is exactly what happened Aug 7-19 2026
      # when this secret sat empty for two weeks).
      - name: Scan and grade (or probe, read-only)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROBE_SKIP_ODDS: ${{ inputs.kalshi_only == true && '1' || '' }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python sports_probe.py
          else
            python sports_scanner.py
          fi

      - name: Commit the card
        if: ${{ always() && inputs.probe != 'true' }}
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sports card $(date -u +'%F %H:%M')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

name: Loss autopsy

on:
  workflow_run:
    workflows: ["settle"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Autopsy the settled bets
        run: python autopsy.py

      # THE MODEL LAB (Aug 31 2026): regenerate the per-city model
      # standings right after settlements are graded. continue-on-error
      # so a report bug can never cost autopsy.md its commit; the red
      # flag after the commit still fails the run loudly.
      - name: Model report
        id: modelreport
        continue-on-error: true
        run: python model_report.py

      - name: Commit the report
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "autopsy $(date -u +'%F %H:%M')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done

      - name: Fail loudly if the model report died
        if: steps.modelreport.outcome == 'failure'
        run: |
          echo "model_report.py failed (see its step log above)."
          echo "autopsy.md is unaffected and already committed; this red"
          echo "exists so the failure cannot scroll away green."
          exit 1

name: settle

on:
  schedule:
    - cron: "20 12 * * *"   # daily ~12:20 UTC, after overnight settlements
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Score settled bets
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python settle.py

      - name: Commit results
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "scoreboard $(date -u +'%Y-%m-%d %H:%M')"
          # real retry loop -- the old one-liner fallback died under bash -e
          # whenever no rebase was in progress (see settlements.yml)
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -gt 4 ]; then echo "push failed after $n tries"; exit 1; fi
            git pull --rebase -X ours || { git rebase --abort 2>/dev/null || true; }
            sleep $((2*n))
          done
